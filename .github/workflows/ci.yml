name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The knowledge base is a separate deliverable with its own toolchain, so it
  # gets its own job rather than being bolted onto the app's. It needs a real
  # Postgres: ltree, pg_trgm, the immutability trigger and the atomic publish
  # swap are the things most worth testing, and none of them can be faked.
  knowledge-base:
    runs-on: ubuntu-latest
    env:
      ATUKB_DSN: postgresql://atukb:atukb@127.0.0.1:5432/atukb
    steps:
      - uses: actions/checkout@v4

      # The runner image already ships PostgreSQL 16 with contrib, so we use it
      # rather than a service container. A service container would pull
      # postgres:16 from Docker Hub on every run, which buys nothing here and
      # fails the job outright when the registry is briefly unreachable — as it
      # was on this workflow's first run.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql@16-main.service \
            || sudo pg_ctlcluster 16 main start
          for _ in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          pg_isready
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE atukb LOGIN PASSWORD 'atukb' SUPERUSER"
          sudo -u postgres createdb -O atukb atukb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e "kb[dev]"

      - name: Migrate
        working-directory: kb
        run: alembic upgrade head

      # No network fetch here: the tests that need ingested data skip when the
      # database is empty, so CI checks the schema invariants, the gates and the
      # code grammars on every push. The data-dependent exit criteria run
      # locally against a populated database.
      - name: Tests
        working-directory: kb
        run: pytest -q

      - name: Gates report
        working-directory: kb
        run: python -m atukb.cli gates
