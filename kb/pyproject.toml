[project]
name = "atukb"
version = "0.1.0"
description = "A provenance-first folklore knowledge base (ATU tale types, TMI motifs)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "PyYAML>=6.0",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
atukb = "atukb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atukb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Deprecated usage in atukb's own code is a test failure, deliberately: this
    # is a long-lived data pipeline and a silent deprecation is how it rots.
    "error::DeprecationWarning",
    # ...but a third-party library deprecating its own alias is not something
    # atukb can act on, and as an error it is fatal rather than noisy: the
    # warning is raised at *import* time, so pytest dies during collection
    # before running a single test. starlette's TestClient — reached via
    # `fastapi.testclient`, which `tests/test_api.py` imports — still touches
    # `anyio.abc.BlockingPortal`, which anyio 4.15 deprecated in favour of
    # `anyio.from_thread.BlockingPortal`.
    #
    # Scoped to this one message rather than to the module or the category, so
    # it lapses the moment starlette stops using the alias, and so no other
    # deprecation gets waved through in the meantime.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
